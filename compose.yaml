services:
  backend:
    build: ./backend
    container_name: perubus-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: perubus-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
