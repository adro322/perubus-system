spring.application.name=perubus-system
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Estimaciones iniciales por ruta; ajustar con los tiempos reales de operación.
app.tracking.eta-days.default=2
app.tracking.eta-days.ica-lima=2
app.tracking.eta-days.lima-nazca=3
app.tracking.eta-days.ica-nazca=2
app.tracking.eta-days.lima-pisco=2
app.tracking.eta-days.ica-pisco=2
#Conexi\u00f3n a la Base de Datos PostgreSQL (Supabase)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuraci\u00f3n de JPA (Hibernate) 
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuraci\u00f3n del pool de conexiones
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1


# API externa de DNI/RUC (Decolecta). El token va en el archivo .env (DECOLECTA_TOKEN)
decolecta.url=https://api.decolecta.com
decolecta.token=${DECOLECTA_TOKEN:}
